<style>
  html,body{margin:0;height:100%;background:#0d1e3a;overflow:hidden;}
  #splash{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0d1e3a;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;padding:env(safe-area-inset-top) 0 0;}
  #splash img{width:112px;height:112px;border-radius:24px;margin-bottom:22px;}
  .ring{width:44px;height:44px;border:5px solid rgba(255,255,255,.22);border-top-color:#e03a3a;border-radius:50%;animation:spin 1s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg)}}
  .t{margin-top:16px;font-size:15px;opacity:.85}
  .fallback{margin-top:20px;font-size:13px;opacity:.8} .fallback a{color:#9ec2ff}
</style>
</head>
