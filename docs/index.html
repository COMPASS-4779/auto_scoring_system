<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;background:#0d1e3a;color:#fff;font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;}
  .wrap{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px 22px calc(28px + env(safe-area-inset-bottom));}
  .logo{width:min(280px,74vw);height:auto;filter:drop-shadow(0 6px 18px rgba(0,0,0,.35));}
  h1{font-size:20px;margin:22px 0 26px;font-weight:600;letter-spacing:.02em}
  .sub{font-size:13px;opacity:.75;margin:0 0 26px}
  .btn{display:block;width:100%;max-width:320px;padding:16px 20px;border-radius:14px;background:#c9a24a;color:#0d1e3a;font-size:17px;font-weight:700;text-decoration:none;box-shadow:0 6px 18px rgba(201,162,74,.3);}
  .btn:active{transform:translateY(1px)}
  .tip{margin-top:28px;max-width:340px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:14px;padding:16px 18px;text-align:left;font-size:13px;line-height:1.75;}
  .tip b{color:#e7c987}
  .ring{width:40px;height:40px;border:5px solid rgba(255,255,255,.2);border-top-color:#c9a24a;border-radius:50%;animation:spin 1s linear infinite;margin-top:22px}
  @keyframes spin{to{transform:rotate(360deg)}}
  .hide{display:none}
</style>
</head>
